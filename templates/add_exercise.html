{% extends "base.html" %}

{% block title %}Add Exercise{% endblock %}

{% block content %}

<h3>Add Exercise</h3>

<form method="post">

    <div class="mb-3">
        <label class="form-label">
            Activity
        </label>

        <select class="form-control" name="activity">

            <option value="Walking" selected>
                Walking
            </option>

            <option value="Running">
                Running
            </option>

            <option value="Cycling">
                Cycling
            </option>

            <option value="Cardio">
                Cardio
            </option>

            <option value="Power">
                Power
            </option>

            <option value="Gym">
                Gym
            </option>

            <option value="Other">
                Other
            </option>

        </select>
    </div>


    <div class="mb-3">
        <label class="form-label">
            Intensity
        </label>

        <select class="form-control" name="intensity">

            <option value="Light" selected>
                Light
            </option>

            <option value="Moderate">
                Moderate
            </option>

            <option value="High">
                High
            </option>

        </select>
    </div>


    <div class="mb-3">
        <label class="form-label">
            Duration (minutes)
        </label>

        <input
            type="number"
            class="form-control"
            name="duration"
            value="30"
            min="1">
    </div>


    <div class="d-flex gap-2">
        <a href="/sugar/add" class="btn btn-secondary">
            Back
        </a>

        <button class="btn btn-success" type="submit">
            Save  Exercise
        </button>
    </div>

</form>

{% endblock %}
