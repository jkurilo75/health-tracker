{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<h3>Reset your password</h3>

<form method="post">

    <input type="password"
           name="password"
           class="form-control mb-2"
           placeholder="New password"
           required>

    <button class="btn btn-primary w-100">
        Update password
    </button>

</form>

{% endblock %}
