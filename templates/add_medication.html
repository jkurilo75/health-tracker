{% extends "base.html" %}

{% block title %}Add Medication{% endblock %}

{% block content %}

<h3>Add Medication</h3>

<form method="post">

    <div class="mb-3">
        <label class="form-label">
            Medication
        </label>

        <select class="form-control" name="medication">

            <option value="Metformin">
                Metformin
            </option>

            <option value="Other">
                Other
            </option>

        </select>
    </div>


    <div class="mb-3">
        <label class="form-label">
            Dose
        </label>

        <select class="form-control" name="dose">

            <option value="500 mg">
                500 mg
            </option>

            <option value="850 mg">
                850 mg
            </option>

            <option value="1000 mg">
                1000 mg
            </option>

        </select>
    </div>


    <div class="d-flex gap-2">
        <a href="/sugar/add" class="btn btn-secondary">
            Back
        </a>

        <button class="btn btn-success" type="submit">
            Save  Medication
        </button>
    </div>

</form>


{% endblock %}
