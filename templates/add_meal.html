{% extends "base.html" %}

{% block title %}Add Meal{% endblock %}

{% block content %}

<h3 class="mb-4">Add Meal</h3>

<form method="post" enctype="multipart/form-data">

    <!-- Meal type -->
    <div class="mb-3">
        <label class="form-label">Meal</label>
        <select class="form-control" name="meal_type">
            <option>Breakfast</option>
            <option>Lunch</option>
            <option>Dinner</option>
            <option>Snack</option>
        </select>
    </div>

    <!-- Portion -->
    <div class="mb-4">
        <label class="form-label">Portion size</label>

        <div class="form-check">
            <input class="form-check-input"
                   type="radio"
                   name="portion"
                   value="Small"
                   id="small">
            <label class="form-check-label" for="small">
                Small
            </label>
        </div>

        <div class="form-check">
            <input class="form-check-input"
                   type="radio"
                   name="portion"
                   value="Medium"
                   id="medium"
                   checked>
            <label class="form-check-label" for="medium">
                Medium
            </label>
        </div>

        <div class="form-check">
            <input class="form-check-input"
                   type="radio"
                   name="portion"
                   value="Large"
                   id="large">
            <label class="form-check-label" for="large">
                Large
            </label>
        </div>
    </div>

    <hr>

    <!-- START Calculate from product label -->
    <h5>Calculate from product label</h5>

    <div class="mb-3">
        <label class="form-label">
            Product weight (grams)
        </label>
        <input 
            type="number"
            step="1"
            class="form-control"
            id="product_weight"
            name="product_weight"
            oninput="calculateMacros()">
    </div>


    <h6>Per 100g product:</h6>

    <div class="mb-3">
        <label>Carbohydrates (g)</label>
        <input
            type="number"
            step="0.1"
            class="form-control"
            id="carbs100"
            name="carbs100"
            oninput="calculateMacros()">
    </div>


    <div class="mb-3">
        <label>Protein (g)</label>
        <input
            type="number"
            step="0.1"
            class="form-control"
            id="protein100"
            name="protein100"
            oninput="calculateMacros()">
    </div>


    <div class="mb-3">
        <label>Fat (g)</label>
        <input
            type="number"
            step="0.1"
            class="form-control"
            id="fat100"
            name="fat100"
            oninput="calculateMacros()">
    </div>

    <!-- END Calculate from product label -->

    <hr>

    <!-- Carbohydrates -->
     <h5>Adjust percentages manually</h5>
    <div class="mb-3">
        <label class="form-label">
            Carbohydrates:
            <span id="carbsValue">50</span>%
        </label>

        <input
            type="range"
            class="form-range"
            min="0"
            max="100"
            value="50"
            name="carbs"
            id="carbs">
    </div>


    <!-- Protein -->
    <div class="mb-3">
        <label class="form-label">
            Protein:
            <span id="proteinValue">30</span>%
        </label>

        <input
            type="range"
            class="form-range"
            min="0"
            max="100"
            value="30"
            name="protein"
            id="protein">
    </div>


    <!-- Fat -->
    <div class="mb-3">
        <label class="form-label">
            Fat:
            <span id="fatValue">20</span>%
        </label>

        <input
            type="range"
            class="form-range"
            min="0"
            max="100"
            value="20"
            name="fat"
            id="fat">
    </div>


    <div class="alert alert-secondary">
        Total:
        <strong><span id="total">100</span>%</strong>
    </div>

    <div class="mb-3">
    <label class="form-label">
        Upload Meal photo:
    </label>

    <input
        class="form-control"
        type="file"
        name="photo"
        accept="image/*">
    </div>
        
    <div class="d-flex gap-2">
        <a href="/sugar/add" class="btn btn-secondary">
        Back
        </a>

        <button class="btn btn-success" type="submit">
            Save Meal
        </button>

        <button 
            class="btn btn-secondary" 
            type="button"
            onclick="restoreDefaults()">
            Restore
        </button>

        <button 
            class="btn btn-warning" 
            type="button"
            onclick="setKeto()">
            Keto diet
        </button>        
    </div>

</form>

<script>

let sliders = {
    carbs: document.getElementById("carbs"),
    protein: document.getElementById("protein"),
    fat: document.getElementById("fat")
};

let values = {
    carbs: document.getElementById("carbsValue"),
    protein: document.getElementById("proteinValue"),
    fat: document.getElementById("fatValue")
};


// Save initial ratios once when page loads
let initialRatios = {};

Object.keys(sliders).forEach(key => {
    initialRatios[key] = parseInt(sliders[key].value);
});

function restoreDefaults() {

    for (let key in sliders) {
        sliders[key].value = initialRatios[key];
    }

     // clear product label fields
    document.getElementById("product_weight").value = "";
    document.getElementById("carbs100").value = "";
    document.getElementById("protein100").value = "";
    document.getElementById("fat100").value = "";

    updateDisplay();
}

function setKeto() {

    sliders.carbs.value = 0;
    sliders.protein.value = 50;
    sliders.fat.value = 50;

    updateDisplay();

    Object.keys(sliders).forEach(key => {
        initialRatios[key] = parseInt(sliders[key].value);
    });
}

// Calculate the ratio of the two untouched sliders
function redistribute(changed) {

    let remaining = 100 - parseInt(sliders[changed].value);

    let others = Object.keys(sliders)
        .filter(x => x !== changed);


    let first = others[0];
    let second = others[1];


    let firstRatio =
        initialRatios[first] /
        (initialRatios[first] + initialRatios[second]);


    let firstValue = Math.floor(
        remaining * firstRatio
    );


    let secondValue = remaining - firstValue;


    sliders[first].value = firstValue;
    sliders[second].value = secondValue;


    updateDisplay();
}


function updateDisplay() {

    for (let key in sliders) {
        values[key].textContent =
            sliders[key].value;
    }
}


sliders.carbs.addEventListener(
    "input",
    () => redistribute("carbs")
);

sliders.protein.addEventListener(
    "input",
    () => redistribute("protein")
);

sliders.fat.addEventListener(
    "input",
    () => redistribute("fat")
);


updateDisplay();

</script>

<script>

function calculateMacros()
{
    let weight =
        parseFloat(
            document.getElementById("product_weight").value
        );


    let carbs100 =
        parseFloat(
            document.getElementById("carbs100").value
        ) || 0;

    let protein100 =
        parseFloat(
            document.getElementById("protein100").value
        ) || 0;

    let fat100 =
        parseFloat(
            document.getElementById("fat100").value
        ) || 0;


    if (!weight)
    {
        alert("Enter product weight");
        return;
    }


    let carbs =
        carbs100 / 100 * weight;

    let protein =
        protein100 / 100 * weight;

    let fat =
        fat100 / 100 * weight;


    let total =
        carbs + protein + fat;

    if (total === 0) {
        sliders.carbs.value = 33;
        sliders.protein.value = 33;
        sliders.fat.value = 34;
    }
    else
    {
        let carbsPct =
            carbs / total * 100;

        let proteinPct =
            protein / total * 100;

        let fatPct =
            fat / total * 100;
    
        sliders.carbs.value = Math.round(carbsPct);
        sliders.protein.value = Math.round(proteinPct);
        sliders.fat.value = 100 - sliders.carbs.value - sliders.protein.value;
    }
    updateDisplay();

}

</script>

{% endblock %}
