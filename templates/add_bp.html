{% extends "base.html" %}

{% block title %}Add Blood Pressure{% endblock %}

{% block content %}

<form method="post">

    <div class="mb-3">
        <label class="form-label">Systolic</label>

        <input
            type="number"
            class="form-control"
            name="systolic"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Diastolic</label>

        <input
            type="number"
            class="form-control"
            name="diastolic"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Pulse</label>

        <input
            type="number"
            class="form-control"
            name="pulse">
    </div>

    <button
        type="submit"
        class="btn btn-success">
        Save Reading
    </button>

</form>

{% endblock %}
