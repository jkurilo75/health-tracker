{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<form method="post" class="mt-4">

    <input name="username"
           class="form-control mb-2"
           placeholder="Username">

    <input name="password"
           type="password"
           class="form-control mb-2"
           placeholder="Password">

    <button class="btn btn-primary w-100">
        Login
    </button>

</form>

{% endblock %}
