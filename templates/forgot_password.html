{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<h3>Reset your password</h3>

<form method="post">

    <input name="email" placeholder="Enter your email">

    <button type="submit">Reset password</button>

    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}

    {% if message %}
        <p style="color:green">{{ message }}</p>
    {% endif %}

</form>

{% endblock %}
