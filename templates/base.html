<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Health Tracker{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6efd">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="manifest"
          href="{{ url_for('static', filename='manifest.json') }}">
</head>

<body>

<div class="container mt-4">

    <nav class="navbar navbar-expand-lg navbar-light bg-light rounded mb-4">
        <div class="container-fluid">

            <a class="navbar-brand" href="/">
                Health Tracker
            </a>

            <a href="/logout" class="btn btn-sm btn-danger">
                Logout
            </a>

        </div>
    </nav>

    {% block content %}
    {% endblock %}

</div>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js", {
        scope: "/"
    }).then(() => {
        console.log("Service Worker registered");
    }).catch(err => {
        console.log("SW registration failed:", err);
    });
}

async function enableNotifications() {
    if (!("Notification" in window)) return;

    let permission = await Notification.requestPermission();
    console.log("Notification permission:", permission);
}

// Ask once when user opens app
// Prevent spam (only once per tab session)
let reminderShown = false;

window.addEventListener("load", () => {
    if ("Notification" in window && Notification.permission === "default") {
        enableNotifications();
    }
    const now = new Date();
    const hour = now.getHours();

    // between 07:00 and 09:00
    if (hour >= 7 && hour < 9 && !reminderShown) {
        sendSugarReminder();
        reminderShown = true;
    }
});

function sendSugarReminder() {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage("SUGAR_REMINDER");
    }
}
</script>
</body>
</html>
