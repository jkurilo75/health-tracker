{% extends "base.html" %}

{% block title %}Add Blood Sugar{% endblock %}

{% block content %}

<form method="post">

    <div class="mb-3">
        <label class="form-label">Glucose</label>
        <input type="number" step="0.1" class="form-control" name="glucose" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Unit</label>
        <select class="form-control" name="unit">
            <option value="mmol/L">mmol/L</option>
            <option value="mg/dL">mg/dL</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Context</label>
        <select class="form-control" name="context">
            <option>Before 1st meal</option>
            <option>2h after 1st meal</option>
            <option>Before 2nd meal</option>
            <option>2h after 2nd meal</option>
            <option>Before 3rd meal</option>
            <option>2h after 3rd meal</option>
            <option>Bedtime</option>
            <option>At night</option>
        </select>
    </div>

    <button class="btn btn-success" type="submit">
        Save
    </button>

</form>

{% endblock %}
